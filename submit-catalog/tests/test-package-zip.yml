name: Test package-zip input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy catalog submission document and package zip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/catalog"
          cat > "$GITHUB_WORKSPACE/catalog/submission.json" <<'EOF'
          {
            "modelVersion": "1.0.0.0",
            "operation": "CreateOrUpdate",
            "sourcePortal": 526430005,
            "businessJustification": "Test submission",
            "publisherDetails": {
              "publisherId": "test-publisher",
              "publisherDisplayName": "Test Publisher"
            },
            "catalogItems": []
          }
          EOF
          # Create a dummy package zip file
          echo "dummy package content" > /tmp/dummy-package.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          path: '${{ github.workspace }}/catalog/submission.json'
          package-solution-zip-file: 'PackageZipFile'
          package-zip: '/tmp/dummy-package.zip'
          poll-status: 'false'

      - name: Assert action ran with package-zip input (fails gracefully on invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
