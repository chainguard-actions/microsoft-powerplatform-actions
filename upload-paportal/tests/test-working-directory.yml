name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory and upload path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/work-dir/portal-content"
          echo "placeholder" > "$GITHUB_WORKSPACE/work-dir/portal-content/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          upload-path: 'portal-content'
          working-directory: '${{ github.workspace }}/work-dir'

      - name: Assert action ran with working-directory input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials may have been used)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
