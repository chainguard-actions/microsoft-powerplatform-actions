name: Test nuget-feed-username and nuget-feed-password inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          nuget-feed-override: 'https://api.nuget.org/v3/index.json'
          nuget-feed-username: 'testuser'
          nuget-feed-password: 'testpassword'
        continue-on-error: true
      - name: Assert action ran with nuget feed auth inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with nuget-feed-username and nuget-feed-password set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail in harness environment) but nuget-feed-username and nuget-feed-password inputs were accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
