name: Test nuget-feed-override with credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a local nuget feed directory
        run: |
          mkdir -p /tmp/local-nuget-feed
      - id: action
        uses: .
        with:
          nuget-feed-override: '/tmp/local-nuget-feed'
          nuget-feed-username: 'testuser'
          nuget-feed-password: 'testpassword'
        continue-on-error: true
      - name: Assert action ran (succeeded or failed gracefully with custom feed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with nuget-feed-override"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (local feed does not contain PAC packages)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
