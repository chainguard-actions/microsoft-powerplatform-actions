name: Test package-zip input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy package zip file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-artifacts"
          echo "dummy package content" > "$GITHUB_WORKSPACE/test-artifacts/package.zip"
          echo "dummy catalog doc" > "$GITHUB_WORKSPACE/test-artifacts/catalog.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          path: '${{ github.workspace }}/test-artifacts/catalog.json'
          package-solution-zip-file: 'PackageZipFile'
          package-zip: '${{ github.workspace }}/test-artifacts/package.zip'
          poll-status: 'false'

      - name: Assert action ran with package-zip input (fails gracefully on invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with invalid credentials/environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
