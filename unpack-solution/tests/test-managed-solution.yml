name: Test unpack-solution with managed solution type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal fake managed solution zip for testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-input"
          mkdir -p "$GITHUB_WORKSPACE/test-output-managed"
          cd "$GITHUB_WORKSPACE/test-input"
          echo '<?xml version="1.0" encoding="utf-8"?><ImportExportXml version="9.1.0.0" SolutionPackageVersion="9.1" languagecode="1033" generatedBy="CrmExport"><SolutionManifest><UniqueName>TestManagedSolution</UniqueName><LocalizedNames><LocalizedName description="Test Managed Solution" languagecode="1033"/></LocalizedNames><Version>1.0.0.0</Version><Managed>1</Managed></SolutionManifest></ImportExportXml>' > Solution.xml
          zip -j "$GITHUB_WORKSPACE/test-input/TestManagedSolution.zip" Solution.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          solution-file: "${{ github.workspace }}/test-input/TestManagedSolution.zip"
          solution-folder: "${{ github.workspace }}/test-output-managed"
          solution-type: Managed
          overwrite-files: 'true'
          use-lcid: 'false'
          disable-plugin-remap: 'false'
          use-unmanaged-file-for-missing-managed: 'false'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with managed solution type"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (pac CLI or dist not available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
