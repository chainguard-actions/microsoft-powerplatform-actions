name: Test upload-paportal basic invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy upload path
        run: |
          mkdir -p "$GITHUB_WORKSPACE/portal-content"
          echo "dummy content" > "$GITHUB_WORKSPACE/portal-content/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://fake-env.crm.dynamics.com'
          user-name: 'fake-user@fake-org.onmicrosoft.com'
          password-secret: 'fake-password-that-is-invalid'
          upload-path: '${{ github.workspace }}/portal-content'

      - name: Assert action ran and failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
