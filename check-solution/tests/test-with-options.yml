name: Test check-solution with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy zip files for analysis
        run: |
          mkdir -p /tmp/pp-solutions
          echo "dummy solution content" > /tmp/pp-solutions/solution1.zip
          echo "dummy solution content" > /tmp/pp-solutions/solution2.zip

      - id: action
        uses: .
        continue-on-error: true
        with:
          path: '/tmp/pp-solutions/**/*.zip'
          geo: 'UnitedStates'
          fail-on-analysis-error: 'true'
          checker-logs-artifact-name: 'CheckSolutionLogs'
          cloud: 'Public'

      - name: Assert action ran and failed gracefully (no credentials or environment URL)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Power Platform credentials or environment URL)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (perhaps a mock or stub environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
