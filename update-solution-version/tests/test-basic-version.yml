name: Test basic version update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture Solution.xml into workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/TestSolution"
          cp "$GITHUB_WORKSPACE/tests/fixtures/solution/Solution.xml" "$GITHUB_WORKSPACE/TestSolution/Solution.xml"
          echo "Solution.xml placed at: $GITHUB_WORKSPACE/TestSolution/Solution.xml"
          cat "$GITHUB_WORKSPACE/TestSolution/Solution.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          build-version: '2'
          patch-version: '3'
          revision-version: '4'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no solution file found or expected error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
