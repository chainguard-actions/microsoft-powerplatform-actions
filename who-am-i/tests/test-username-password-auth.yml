name: Test who-am-i with username/password credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          user-name: 'testuser@fake-org.onmicrosoft.com'
          password-secret: 'fake-password-secret'
          cloud: 'Public'

      - name: Assert action ran and failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENV_ID: ${{ steps.action.outputs.environment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment-id: $ENV_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENV_ID" ]; then
              echo "FAIL: action succeeded but environment-id output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with environment-id: $ENV_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
