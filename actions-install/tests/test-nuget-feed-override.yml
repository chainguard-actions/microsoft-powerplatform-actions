name: Test nuget-feed-override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          nuget-feed-override: 'https://api.nuget.org/v3/index.json'
        continue-on-error: true
      - name: Assert action ran with nuget-feed-override
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with nuget-feed-override set to nuget.org"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (may fail in harness environment) but nuget-feed-override input was accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
