name: Test working-directory and solution-version inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/pp-workdir
      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          solution-name: 'TestSolution'
          solution-version: '1.0.0.0'
          solution-output-file: 'TestSolution.zip'
          working-directory: '/tmp/pp-workdir'
      - name: Assert action ran (failed gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
