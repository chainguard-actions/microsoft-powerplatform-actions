name: Test strategy gittags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git tags and Solution.xml for gittags strategy
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a version tag for the action to read
          git tag -f v1.0.0.0 HEAD
          # Copy fixture Solution.xml into workspace
          mkdir -p "$GITHUB_WORKSPACE/TestSolution"
          cp "$GITHUB_WORKSPACE/tests/fixtures/solution/Solution.xml" "$GITHUB_WORKSPACE/TestSolution/Solution.xml"
          echo "Solution.xml placed at: $GITHUB_WORKSPACE/TestSolution/Solution.xml"
          echo "Git tags:"
          git tag -l

      - id: action
        uses: .
        continue-on-error: true
        with:
          strategy: 'gittags'
          build-version: '1'

      - name: Assert action ran (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with gittags strategy"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness conditions)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
