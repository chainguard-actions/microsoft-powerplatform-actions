name: Test create-environment with username/password authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          user-name: 'testuser@test-org.onmicrosoft.com'
          password-secret: 'test-password-secret'
          name: 'Test Environment Username Auth'
          region: 'unitedstates'
          type: 'Sandbox'
          currency: 'USD'
          language: 'English (United States)'

      - name: Assert action ran and failed gracefully (no real Power Platform credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENV_URL: ${{ steps.action.outputs.environment-url }}
          ENV_ID: ${{ steps.action.outputs.environment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment-url: $ENV_URL"
          echo "environment-id: $ENV_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENV_URL" ] && [ -z "$ENV_ID" ]; then
              echo "FAIL: action succeeded but both outputs are empty"
              exit 1
            fi
            echo "PASS: action succeeded with environment-url='$ENV_URL' environment-id='$ENV_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Power Platform credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
