name: Test branch-solution with working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config, working directory, and local bare remote
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Disable git LFS to avoid "lfs-standalone-file" adapter errors when pushing to bare repo
          git config lfs.skipPush true
          git lfs uninstall --local 2>/dev/null || true

          # Create a custom working directory with a solution folder inside it
          mkdir -p "$GITHUB_WORKSPACE/workdir/wd-solution/src"
          echo "solution content" > "$GITHUB_WORKSPACE/workdir/wd-solution/solution.xml"
          echo "component" > "$GITHUB_WORKSPACE/workdir/wd-solution/src/component.xml"

          # Create a bare repo under workspace so it's reachable from the action
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          GIT_LFS_SKIP_PUSH=1 git -c lfs.skipPush=true push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          solution-folder: wd-solution
          solution-target-folder: solutions/wd-solution
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          branch-name: test-branch-workdir
          working-directory: ${{ github.workspace }}/workdir
          allow-empty-commit: 'true'
          clobber-branch: 'true'
        continue-on-error: true

      - name: Assert action ran with working-directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom working-directory"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
