name: Test export-data basic app-id auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy schema file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-data"
          cat > "$GITHUB_WORKSPACE/test-data/schema.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <entities></entities>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id-00000000-0000-0000-0000-000000000000'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id-00000000-0000-0000-0000-000000000000'
          schema-file: '${{ github.workspace }}/test-data/schema.xml'
          data-file: '${{ github.workspace }}/test-data/output.zip'

      - name: Assert action ran and failed gracefully (no valid PP environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real environment available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Power Platform environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
