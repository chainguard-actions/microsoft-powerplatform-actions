name: Test optional inputs (target-folder, working-directory, solution-version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/work-dir" "$GITHUB_WORKSPACE/work-dir/cloned-solution"

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://fake-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          solution-name: 'FakeSolution'
          solution-version: '1.0.0.0'
          target-folder: '${{ github.workspace }}/work-dir/cloned-solution'
          working-directory: '${{ github.workspace }}/work-dir'
          run-asynchronously: 'false'
          max-async-wait-time: '30'

      - name: Assert action ran (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real env?)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
