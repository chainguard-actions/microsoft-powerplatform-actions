name: Test restore-environment username/password auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          user-name: 'testuser@fake-org.onmicrosoft.com'
          password-secret: 'fake-password-secret'
          source-url: 'https://source-env.crm.dynamics.com'
          target-url: 'https://target-env.crm.dynamics.com'
          latest-backup: 'true'
          cloud: 'Public'

      - name: Assert action ran and failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
