name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p "$GITHUB_WORKSPACE/work-dir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://fake-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          solution-name: 'FakeSolution'
          working-directory: 'work-dir'
      - name: Assert action ran (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with fake credentials (expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
