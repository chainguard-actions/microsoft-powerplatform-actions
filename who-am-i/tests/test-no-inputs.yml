name: Test who-am-i with no inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action ran and failed gracefully with no credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENV_ID: ${{ steps.action.outputs.environment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment-id: $ENV_ID"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (environment-id: $ENV_ID)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with no credentials provided)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
