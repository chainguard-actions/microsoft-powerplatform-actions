name: Test submit-catalog basic usage with app-id auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create catalog submission document
        run: |
          mkdir -p "$GITHUB_WORKSPACE/catalog"
          cat > "$GITHUB_WORKSPACE/catalog/submission.json" <<'EOF'
          {
            "modelVersion": "1.0.0.0",
            "operation": "CreateOrUpdate",
            "sourcePortal": 526430005,
            "businessJustification": "Test submission",
            "publisherDetails": {
              "publisherId": "test-publisher",
              "publisherDisplayName": "Test Publisher"
            },
            "catalogItemDefinition": {
              "id": "test-item",
              "displayName": "Test Item",
              "description": "Test catalog item",
              "offer": {
                "type": "Component_Collection",
                "deploymentType": "Normal",
                "engineeringName": {
                  "firstName": "Test",
                  "lastName": "Engineer",
                  "email": "test@example.com"
                },
                "supportName": {
                  "firstName": "Test",
                  "lastName": "Support",
                  "email": "support@example.com"
                }
              }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id-00000000-0000-0000-0000-000000000000'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id-00000000-0000-0000-0000-000000000000'
          path: '${{ github.workspace }}/catalog/submission.json'
          package-solution-zip-file: 'ExistingPackage'
          poll-status: 'false'

      - name: Assert action ran and failed gracefully (no real PP environment)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Power Platform environment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (environment may be reachable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
