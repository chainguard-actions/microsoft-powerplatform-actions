name: Test package-zip input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy catalog submission document
        run: |
          mkdir -p "$GITHUB_WORKSPACE/catalog"
          cat > "$GITHUB_WORKSPACE/catalog/submission.json" <<'EOF'
          {
            "modelVersion": "1.0.0.0",
            "operation": "CreateOrUpdate",
            "sourcePortal": 526430005,
            "businessJustification": "Test submission",
            "publisherDetails": {
              "publisherId": "test-publisher",
              "publisherDisplayName": "Test Publisher"
            },
            "catalogItemDefinition": {
              "id": "test-item",
              "displayName": "Test Item",
              "description": "Test description",
              "offer": {
                "type": "Component_Collection",
                "deploymentType": "Normal",
                "engineeringName": {
                  "firstName": "Test",
                  "lastName": "User",
                  "email": "test@example.com"
                },
                "supportName": {
                  "firstName": "Test",
                  "lastName": "User",
                  "email": "test@example.com"
                }
              }
            }
          }
          EOF

      - name: Create dummy package zip file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/packages"
          echo "dummy package content" > /tmp/dummy.txt
          zip "$GITHUB_WORKSPACE/packages/test-package.zip" /tmp/dummy.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          path: '${{ github.workspace }}/catalog/submission.json'
          package-solution-zip-file: 'PackageZipFile'
          package-zip: '${{ github.workspace }}/packages/test-package.zip'
          poll-status: 'false'

      - name: Assert action ran with package-zip input (fails gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Power Platform credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
