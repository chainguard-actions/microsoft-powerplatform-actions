name: Test nuget-feed-override inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          nuget-feed-override: 'https://api.nuget.org/v3/index.json'
          nuget-feed-username: ''
          nuget-feed-password: ''
      - name: Assert pac is available after install
        run: |
          if ! command -v pac &>/dev/null; then
            echo "FAIL: pac command not found after install with nuget-feed-override"
            exit 1
          fi
          echo "PASS: pac is available"
