name: Test pac-version-override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          pac-version-override: '1.30.6'
        continue-on-error: true

      - name: Assert action ran (pac install attempted with version override)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with pac-version-override"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (expected in sandbox environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
