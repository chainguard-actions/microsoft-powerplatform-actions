name: Test assign-user service principal auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-id: 00000000-0000-0000-0000-000000000001
          client-secret: fake-client-secret
          tenant-id: 00000000-0000-0000-0000-000000000002
          environment: https://fake-env.crm.dynamics.com
          user: 00000000-0000-0000-0000-000000000003
          role: System Administrator
          application-user: 'false'

      - name: Assert action ran and failed gracefully (no real Power Platform credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Power Platform environment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials may have been provided)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
