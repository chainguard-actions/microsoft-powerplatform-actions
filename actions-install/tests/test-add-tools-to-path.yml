name: Test add-tools-to-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          add-tools-to-path: 'true'
        continue-on-error: true
      - name: Assert action ran with add-tools-to-path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with add-tools-to-path=true"
            # If pac was added to PATH, it should be findable
            if command -v pac > /dev/null 2>&1; then
              echo "PASS: pac is available on PATH"
            else
              echo "INFO: pac not found on PATH (may require shell reload or different PATH mechanism)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (network/nuget issue acceptable in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
