name: Test clone-solution with username/password auth
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run clone-solution with fake username/password credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://fake-test-env.crm.dynamics.com'
          solution-name: 'FakeSolution'
          user-name: 'fakeuser@fake-org.onmicrosoft.com'
          password-secret: 'fake-password-value'
          cloud: 'Public'
          run-asynchronously: 'false'
          max-async-wait-time: '60'

      - name: Assert action failed gracefully with fake username/password
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with fake username/password credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
