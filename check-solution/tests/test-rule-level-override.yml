name: Test rule-level-override input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy zip file and rule override file for analysis
        run: |
          mkdir -p /tmp/solutions
          echo "dummy" > /tmp/solutions/dummy.zip
          cat > /tmp/rule-overrides.json << 'EOF'
          [{"Id":"meta-remove-dup-reg","OverrideLevel":"Medium"},{"Id":"il-avoid-specialized-update-ops","OverrideLevel":"Medium"}]
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: 'fake-app-id'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id'
          path: '/tmp/solutions/*.zip'
          rule-level-override: '/tmp/rule-overrides.json'
          fail-on-analysis-error: 'false'

      - name: Assert action ran with rule-level-override input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with rule-level-override input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
