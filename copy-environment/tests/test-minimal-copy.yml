name: Test copy-environment minimal copy type
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          source-env: 'https://source-env.crm.dynamics.com'
          target-env: 'https://target-env.crm.dynamics.com'
          app-id: 'aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee'
          client-secret: 'fake-client-secret-value'
          tenant-id: 'ffffffff-0000-1111-2222-333333333333'
          copy-type: 'MinimalCopy'
          cloud: 'Public'

      - name: Assert action failed gracefully with MinimalCopy and invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (MinimalCopy with invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
