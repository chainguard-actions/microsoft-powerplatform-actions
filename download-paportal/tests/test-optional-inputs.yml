name: Test download-paportal optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.dynamics.com'
          app-id: '00000000-0000-0000-0000-000000000002'
          client-secret: 'fake-client-secret'
          tenant-id: '00000000-0000-0000-0000-000000000003'
          cloud: 'Public'
          download-path: '${{ github.workspace }}/portal-download'
          website-id: '00000000-0000-0000-0000-000000000001'
          exclude-entities: 'adx_webpage,adx_webfile'
          overwrite: 'true'
          model-version: 'default'
          working-directory: '${{ github.workspace }}'

      - name: Assert action ran and failed gracefully (no real Power Platform env available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real env available?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Power Platform environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
