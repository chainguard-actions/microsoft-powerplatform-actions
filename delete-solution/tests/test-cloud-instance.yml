name: Test delete-solution with non-default cloud instance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment-url: 'https://test-env.crm.microsoftonline.us'
          app-id: 'fake-app-id-00000000-0000-0000-0000-000000000000'
          client-secret: 'fake-client-secret'
          tenant-id: 'fake-tenant-id-00000000-0000-0000-0000-000000000000'
          solution-name: 'GovSolution'
          cloud: 'UsGov'

      - name: Assert action ran and failed gracefully with invalid credentials on GovCloud
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials on UsGov cloud"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but not a test failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
