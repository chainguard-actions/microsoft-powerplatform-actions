name: Test assign-group missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          environment: 'https://fake-env.crm.dynamics.com'
          group: '00000000-0000-0000-0000-000000000001'
          group-name: 'TestGroup'
          role: 'System Administrator'
          team-type: 'AadSecurityGroup'
          membership-type: 'Members'
          # No auth credentials provided at all

      - name: Assert action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no credentials provided)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
