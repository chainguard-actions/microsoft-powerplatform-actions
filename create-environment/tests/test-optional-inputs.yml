name: Test create-environment with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          app-id: 'test-app-id-00000000-0000-0000-0000-000000000000'
          client-secret: 'test-client-secret'
          tenant-id: 'test-tenant-id-00000000-0000-0000-0000-000000000000'
          name: 'Test Environment Optional Inputs'
          region: 'unitedstates'
          type: 'Sandbox'
          currency: 'USD'
          language: 'English (United States)'
          domain: 'testenvci'
          templates: 'D365_Sales,D365_CustomerService'
          security-group-id: '00000000-0000-0000-0000-000000000001'

      - name: Assert action ran and failed gracefully (no real Power Platform credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENV_URL: ${{ steps.action.outputs.environment-url }}
          ENV_ID: ${{ steps.action.outputs.environment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "environment-url: $ENV_URL"
          echo "environment-id: $ENV_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ENV_URL" ] && [ -z "$ENV_ID" ]; then
              echo "FAIL: action succeeded but both outputs are empty"
              exit 1
            fi
            echo "PASS: action succeeded with environment-url='$ENV_URL' environment-id='$ENV_ID'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Power Platform credentials available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
